:root {
  --zemin: #f6f8fb; --kart: #ffffff; --yazi: #1b2430; --soluk: #4a5565; --cizgi: #8a96a8;
  --vurgu: #1a4f9c; --vurgu-acik: #e3edfb; --sari: #ffe27a; --sari-koyu: #8a6a00;
  --yesil: #1f6b23; --yesil-acik: #e2f3e3; --kirmizi: #b71c1c; --kirmizi-acik: #fbe4e4;
  --mor: #5b3a9e; --turuncu: #a14a00; --gri: #c9d0da;
  --yazi-tipi: 'Nunito', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--zemin); color: var(--yazi); font-family: var(--yazi-tipi); font-size: 16px; line-height: 1.4; overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
.ks-ust { background: var(--vurgu); color: #fff; padding: 10px 16px 12px; }
.ks-ust h1 { margin: 4px 0 0; font-size: 18px; font-weight: 900; line-height: 1.25; overflow-wrap: anywhere; }
.ks-geri { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; color: #fff; font-weight: 800; text-decoration: underline; }
/* Gömülü (öğrenci ekranındaki katman): başlık solda, "Kapat" sağda, tek satır; yer kazanılır */
.ks-ust.ks-gomulu { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 12px; }
.ks-ust.ks-gomulu h1 { order: 1; margin: 0; font-size: 16px; flex: 1 1 auto; min-width: 0; }
.ks-ust.ks-gomulu .ks-geri { order: 2; flex: none; padding: 4px 12px; background: rgba(255,255,255,.16); border: 2px solid #fff; border-radius: 10px; text-decoration: none; font-family: inherit; font-size: 16px; }
.ks-ana { max-width: 680px; margin: 0 auto; padding: 14px 16px 40px; min-width: 0; }
.ks-tanitim { background: var(--sari); border: 3px solid var(--sari-koyu); border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; display: grid; gap: 8px; justify-items: start; }
.ks-tanitim h2 { margin: 0; font-size: 18px; }
.ks-tanitim p { margin: 0; font-weight: 700; }
.ks-bas { margin: 0 0 8px; font-size: 20px; font-weight: 900; }
.ks-tahtaust { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0 0 8px; }
.ks-tahtaust .ks-bas { margin: 0; font-size: 19px; }
.ks-tahtaust .ks-rozetler { margin: 0; }
.ks-kartlar { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 560px) { .ks-kartlar { grid-template-columns: 1fr 1fr; } }
.ks-kartbtn { display: grid; gap: 4px; text-align: left; padding: 12px 14px; min-height: 96px; min-width: 0; background: var(--kart); border: 2px solid var(--vurgu); border-radius: 10px; }
.ks-kartbtn b { font-size: 19px; font-weight: 900; color: var(--vurgu); }
.ks-kartbtn span { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.ks-rozetler { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.ks-rozet { display: inline-block; padding: 2px 9px; border: 2px solid var(--yazi); border-radius: 999px; font-size: 13.5px; font-weight: 800; background: var(--zemin); }
.ks-bos { padding: 12px; border: 2px dashed var(--cizgi); border-radius: 10px; font-weight: 700; }
.ks-serit { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; background: var(--sari); border: 3px solid var(--sari-koyu); border-radius: 10px; padding: 7px 10px; margin: 0 0 10px; font-weight: 800; font-size: 15px; line-height: 1.3; }
.ks-serit-yazi { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.ks-serit .ks-dugme { flex: none; min-height: 48px; }
.ks-kap { background: var(--kart); border: 2px solid var(--gri); border-radius: 10px; padding: 8px; min-width: 0; margin: 0 0 10px; overflow-x: auto; }
.ks-bilgi { margin: 0 0 12px; padding: 10px 12px; min-height: 46px; font-weight: 800; background: var(--vurgu-acik); border-left: 6px solid var(--vurgu); border-radius: 6px; overflow-wrap: anywhere; }
.ks-bilgi:empty::before { content: 'Sonuç burada görünür.'; font-weight: 600; color: var(--soluk); }
.ks-dugmeler { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
.ks-dugme { flex: 1 1 120px; min-height: 48px; min-width: 0; padding: 8px 12px; background: var(--vurgu); color: #fff; border: 2px solid var(--vurgu); border-radius: 10px; font-weight: 900; }
.ks-dugme.ikincil { background: var(--kart); color: var(--vurgu); }
.ks-dugme[aria-disabled="true"] { opacity: .6; border-style: dashed; }
.ks-dugme:focus-visible, .ks-sec:focus-visible, .ks-kartbtn:focus-visible, .ks-geri:focus-visible { outline: 3px solid var(--turuncu); outline-offset: 2px; }
.ks-neden { margin: 0 0 10px; min-height: 1.4em; font-weight: 700; color: var(--soluk); overflow-wrap: anywhere; }
.ks-sayac { margin: 0 0 10px; font-weight: 800; }
.ks-soru { background: var(--kart); border: 3px solid var(--vurgu); border-radius: 10px; padding: 12px; margin: 0 0 12px; display: grid; gap: 10px; min-width: 0; }
.ks-soru .ks-etiket { margin: 0; font-weight: 800; color: var(--soluk); font-size: 14.5px; }
.ks-soru .ks-metin { margin: 0; font-weight: 800; font-size: 17px; overflow-wrap: anywhere; }
.ks-secenekler { display: grid; gap: 8px; }
.ks-sec { min-height: 48px; padding: 8px 12px; text-align: left; background: var(--kart); border: 2px solid var(--vurgu); border-radius: 10px; font-weight: 800; overflow-wrap: anywhere; min-width: 0; }
.ks-sec.dogru { background: var(--yesil-acik); border-color: var(--yesil); }
.ks-sec.yanlis { background: var(--kirmizi-acik); border-color: var(--kirmizi); }
.ks-sec[disabled] { cursor: default; }
.ks-sonuc { margin: 0; padding: 10px 12px; font-weight: 800; border-radius: 8px; overflow-wrap: anywhere; }
.ks-sonuc.iyi { background: var(--yesil-acik); border: 2px solid var(--yesil); color: var(--yesil); }
.ks-sonuc.kotu { background: var(--kirmizi-acik); border: 2px solid var(--kirmizi); color: var(--kirmizi); }
.ks-sonuc small { display: block; color: var(--yazi); font-weight: 700; font-size: 15px; margin-top: 4px; }
.ks-ozet h3 { margin: 0 0 6px; font-size: 20px; }
.ks-ozet ul { margin: 6px 0 0; padding-left: 20px; }
.ks-ozet li { margin: 0 0 6px; font-weight: 700; overflow-wrap: anywhere; }

  // ---- tahta görünümü ----
  function kapat() { if (oturum) { gosterDur(oturum); oturum = null; } }

  function ayar(b, neden) { b.setAttribute('aria-disabled', neden ? 'true' : 'false'); b._neden = neden || ''; }
  function tusYap(o, yazi, sinif, fn) {

  function tahtaAc(t) {
    var o = oturum = { t: t, nesne: null, dokunus: 0, gosteriyor: false, zaman: null, adimlar: null, i: 0,
      sayacD: 0, sayacT: 0, qno: 0, kuyruk: [], acik: null, cevaplandi: false, meydan: null,

    // Sarı şerit: "Görev:" ile yazı aynı paragrafta akar (en çok iki satır); "Soruya git" altına gelir
    u.serit = e('div', 'ks-serit'); u.serit.setAttribute('role', 'note');

      serit: function (y) { if (o !== oturum) return; o.sonSerit = y; if (!o.acik && !o.meydan) u.seritYazi.textContent = y; },
      bilgi: function (y) { if (o !== oturum) return; u.bilgi.textContent = y == null ? '' : y; },

      },

    };

  function guncelle(o) {

  // ---- Göster yürütücüsü ----

  function gosterTikla(o) {
    if (o.gosteriyor) { gosterDur(o); o.ui.seritYazi.textContent = 'Şimdi sen dene.'; guncelle(o); return; }
    var ad = null;
    try { if (o.nesne.sifirla) o.nesne.sifirla(); ad = o.nesne.goster && o.nesne.goster(); } catch (x) { ad = null; }
    if (!ad || !ad.length) { o.ui.neden.textContent = 'Bu tahtada gösterim yok.'; return; }
    o.dokunus = 0; o.adimlar = ad; o.i = 0; o.gosteriyor = true;

  function gosterDur(o) {

    o.gosteriyor = false;

  function adim(o) {
    if (!o.gosteriyor || o !== oturum) return;
    if (o.zaman) { w.clearTimeout(o.zaman); o.zaman = null; }
    if (o.i >= o.adimlar.length) {

      o.ui.seritYazi.textContent = o.sonSerit;

    o.ui.seritYazi.textContent = s.yazi || '';
    o.zaman = w.setTimeout(function () { adim(o); }, ADIM_MS);

  // ---- sorular, N+3, meydan oku ----
  function ayniDizi(a, b) { return a.length === b.length && a.every(function (x, i) { return x === b[i]; }); }
  function karistirSoru(q) {
    var dm = q.secenekler[q.dogru], yeni = w.karistir(q.secenekler, rngAl()), n = 0;
    while (ayniDizi(yeni, q.secenekler) && n++ < 5) yeni = w.karistir(q.secenekler, rngAl());
    if (ayniDizi(yeni, q.secenekler)) yeni = yeni.slice(1).concat(yeni[0]);
    var c = {}; Object.keys(q).forEach(function (k) { c[k] = q[k]; });
    c.secenekler = yeni; c.dogru = yeni.indexOf(dm);
    return c;
  }
  function gecerli(q) { return q && q.metin && q.secenekler && q.secenekler.length >= 2 && q.dogru >= 0 && q.dogru < q.secenekler.length; }
  function uret(o) { var q = null; try { q = o.nesne.soru && o.nesne.soru(rngAl()); } catch (x) { q = null; } return gecerli(q) ? q : null; }

  // keşifte: vadesi gelmiş N+3 sorusu varsa onu (seçenekleri karıştırılmış) ver, yoksa yeni üret
  function yeniSoru(o) {
    var sira = o.qno + 1;
    for (var k = 0; k < o.kuyruk.length; k++) {
      if (o.kuyruk[k].due <= sira) { var q = karistirSoru(o.kuyruk.splice(k, 1)[0].q); o.qno = sira; return { q: q, tekrar: true, sira: sira }; }
    }
    var y = uret(o);
    if (!y) return null;
    o.qno = sira;
    return { q: y, tekrar: false, sira: sira };
  }

  // Karar (yönetici, 2026-11-09; Özgür'ün kuralı "sayfa kaymasın"): kendiliğinden gelen soru sayfayı kaydırmaz.
  // Altta belirir; şerit haber verir ve "↓ Soruya git" sunar. Kaydırma yalnız kullanıcının eyleminde ve yumuşak.
  function soruAc(o, kendiliginden) {
    if (o.acik || o.meydan || o.gosteriyor) return;
    var d = yeniSoru(o);
    if (!d) { o.ui.neden.textContent = 'Bu tahtada soru yok.'; return; }
    o.acik = 'soru';
    soruCiz(o, d, false, !kendiliginden);
    if (kendiliginden) {
      o.ui.seritYazi.textContent = 'Aşağıda bir soru belirdi. ';
      var git = dugme('↓ Soruya git', 'ikincil', function () {
        var p = o.ui.panel;
        if (p.scrollIntoView) p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      git.classList.add('ks-soruya-git');
      o.ui.soruyaGit = git;
      o.ui.serit.appendChild(git);
    } else {
      o.ui.seritYazi.textContent = 'Soruyu cevapla; sonra keşfe dönersin.';
    }
    guncelle(o);
  }

  function soruCiz(o, d, meydan, kaydir) {
    var q = d.q, p = o.ui.panel;
    bosalt(p); p.hidden = false; o.cevaplandi = false;
    var et = meydan ? 'Meydan oku · soru ' + o.meydan.n + '/' + MEYDAN
      : (d.tekrar ? 'Tekrar sorusu: bunu daha önce yanlış yaptın. Seçenekler karıştı.' : 'Soru ' + d.sira);
    p.appendChild(e('p', 'ks-etiket', et));
    var m = e('p', 'ks-metin', q.metin); m.id = 'ks-soru-metin'; p.appendChild(m);
    var sc = e('div', 'ks-secenekler'); sc.setAttribute('role', 'group'); sc.setAttribute('aria-labelledby', 'ks-soru-metin');
    var sonuc = e('p', 'ks-sonuc'); sonuc.hidden = true;
    var devam = dugme(meydan ? (o.meydan.n >= MEYDAN ? 'Sonucu gör' : 'Sonraki soru') : 'Devam', '', function () {
      if (meydan) meydanSonraki(o); else soruKapat(o);
    });
    devam.hidden = true;
    var dugmeler = [];
    q.secenekler.forEach(function (s, j) {
      var b = e('button', 'ks-sec', s); b.type = 'button';
      b.addEventListener('click', function () {
        if (o.cevaplandi) return;
        o.cevaplandi = true;
        var ok = j === q.dogru;
        dugmeler.forEach(function (x, i) {
          x.disabled = true;
          if (i === q.dogru) { x.classList.add('dogru'); x.textContent = '✓ ' + q.secenekler[i]; }
          else if (i === j) { x.classList.add('yanlis'); x.textContent = '✗ ' + q.secenekler[i]; }
        });
        if (meydan) {
          o.meydan.cevap++;
          if (ok) o.meydan.d++; else o.meydan.yanlis.push({ metin: q.metin, dogru: q.secenekler[q.dogru] });
          sonuc.className = 'ks-sonuc ' + (ok ? 'iyi' : 'kotu');
          sonuc.textContent = ok ? 'Bildin!' : 'Olmadı';
        } else {
          o.sayacT++;
          if (ok) o.sayacD++; else o.kuyruk.push({ q: q, due: d.sira + N3 });
          sonuc.className = 'ks-sonuc ' + (ok ? 'iyi' : 'kotu');
          sonuc.textContent = ok ? 'Bildin!' : 'Olmadı';
          if (q.aciklama) sonuc.appendChild(e('small', null, q.aciklama));
          if (!ok) sonuc.appendChild(e('small', null, 'Bu soru ' + N3 + ' soru sonra yeniden gelecek.'));

        try { devam.focus(); } catch (x) { /* odak yok */ }

    });
    p.appendChild(sc); p.appendChild(sonuc); p.appendChild(devam);
    if (kaydir && p.scrollIntoView) p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function soruKapat(o) {
    if (o.ui.soruyaGit) { o.ui.soruyaGit.remove(); o.ui.soruyaGit = null; }
    o.ui.panel.hidden = true; bosalt(o.ui.panel);
    o.acik = null; o.cevaplandi = false;
    o.ui.seritYazi.textContent = o.sonSerit;

  function meydanBasla(o) {
    if (o.meydan || o.acik || o.gosteriyor) return;
    o.meydan = { n: 0, d: 0, cevap: 0, yanlis: [], goruldu: {} };
    o.acik = 'meydan';

    meydanSonraki(o);
  }
  function meydanSonraki(o) {

      '<polygon class="sk-ok" points="' + f(t[0]) + ',' + f(t[1]) + ' ' + f(l[0]) + ',' + f(l[1]) + ' ' + f(rr[0]) + ',' + f(rr[1]) + '"/>';

    function tik() {

<script>
// Keşif tahtası: #uzaklik (Uzaklık dürbünü; H1 · Güneş).
// Yanılgılar: Y31 (görünen boy = gerçek boy), Y03 (Güneş sabit, dönmez), Y02 (Güneş yanan odun), Y01 (Güneş gezegen).
// Üç sekme: Uzaklık · Leke · Güneş neyden? Model bu dosyadadır; görünen boy görüş açısından (2·atan(r/d)) hesaplanır,
// gerçek boy (r) uzaklıkla değişmez. Sayı ve km yazılmaz; sorular modelden hesaplanır.
(function (w) {
  'use strict';
  if (!w.KESIF || !w.KESIF.tahtaEkle) return;

  // ---------- model ----------
  var RAD = Math.PI / 180;
  var KUCUK = { r: 8, d: 40 };            // küçük top: yakında, sabit
  var BUYUK_R = 24;                       // büyük topun gerçek yarıçapı (uzaklıkla değişmez)
  var D0 = 80, ADIM = 20, N_KONUM = 8;    // büyük topun uzaklığı: 80, 100, ..., 220 (120'de görünen boy eşit)
  var LEKELER = [{ lon: -25, lat: 22 }, { lon: 35, lat: -18 }];
  var GUNES = { tur: 'yıldız', kendiIsigi: true, yanar: false, kul: false, uzak: true };   // Güneş: yıldız, odun gibi yanmaz
  var AY = { uzak: false };                // Ay: Güneş'ten çok daha yakın
  var ODUN_ADIM = [{ ad: 'Odun', bilgi: 'Yeni odun.' }, { ad: 'Yanıyor: alev var', bilgi: 'Odun yanıyor. Alev var.' }, { ad: 'Kül kaldı', bilgi: 'Odun yandı, bitti. Geriye kül kaldı.' }];

  function uzaklik(i) { return D0 + ADIM * i; }
  function aci(r, d) { return 2 * Math.atan(r / d) / RAD; }            // görüş açısı (derece): "görünen boy"
  function gorunenBuyuk(i) { return aci(BUYUK_R, uzaklik(i)); }
  function gercekBoy(i) { return BUYUK_R; }                              // gerçek boy uzaklık konumuna bağlı değildir
  function gorunenKucuk() { return aci(KUCUK.r, KUCUK.d); }
  // Görünen: büyük top küçük topa göre 'buyuk' | 'esit' | 'kucuk' görünür. Gerçek: büyük top her zaman daha büyüktür.
  function karsilastir(i) {
    var a = gorunenBuyuk(i), b = gorunenKucuk();
    return Math.abs(a - b) < 1e-9 ? 'esit' : (a > b ? 'buyuk' : 'kucuk');
  }
  function gercekFark() { return BUYUK_R > KUCUK.r; }
  function normal(a) { return ((a + 540) % 360) - 180; }
  // Güneş yüzünde leke: lam = leke boylamı + dönme açısı; lam ±90 arasında yüzün önündedir. x sağa doğru artar.
  function lekeKonum(psi, l) {
    var lam = normal(l.lon + psi);
    var on = Math.cos(lam * RAD) > 1e-9;
    return { on: on, x: Math.cos(l.lat * RAD) * Math.sin(lam * RAD), y: Math.sin(l.lat * RAD), kisalma: Math.cos(lam * RAD) };
  }
  function lekeX(psi) { return LEKELER.map(function (l) { var k = lekeKonum(psi, l); return k.on ? Math.round(k.x * 1e6) / 1e6 : null; }); }

  function yeni() { return { sekme: 'uzaklik', i: 6, psi: 0, donuyor: false, odun: 0, secili: false, kutu: '' }; }

  // ---------- sorular ----------
  function karis(dizi, rng) {
    if (w.karistir) return w.karistir(dizi, rng);
    var a = dizi.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function sec(rng, dizi) { return dizi[Math.floor(rng() * dizi.length)]; }
  function yap(metin, dogru, yanlislar, aciklama, oge, rng) {
    var dizi = karis([dogru].concat(yanlislar), rng);
    return { metin: metin, secenekler: dizi, dogru: dizi.indexOf(dogru), aciklama: aciklama, oge: oge };
  }
  function soruGorunen(rng) {
    var uzat = rng() < 0.5, i1 = uzat ? 2 : 5, i2 = uzat ? 5 : 2;   // 2: yakın, 5: uzak
    var kucuk = gorunenBuyuk(i2) < gorunenBuyuk(i1);
    var dogru = kucuk ? 'Küçük görünür' : 'Büyük görünür';
    return yap('Büyük top ' + (uzat ? 'uzaklaştırıldı' : 'yaklaştırıldı') + ". Gözde görünüşte ne olur?", dogru,
      [kucuk ? 'Büyük görünür' : 'Küçük görünür', 'Aynı görünür', kucuk ? 'Gerçekte de küçülür' : 'Gerçekte de büyür'],
      'Uzaklaşan cisim gözde küçük görünür. Yaklaşan cisim büyük görünür. Gerçek boyu değişmez.', uzat ? 'ud-gorunen-uzak' : 'ud-gorunen-yakin', rng);
  }
  function soruGercek(rng) {

      api.bilgi(v ? 'Güneş çok çok büyük; ekrana sığmıyor. Dünya Ay\'dan büyük.' : "Dünya, Ay'dan büyük. Güneş burada görünmüyor.");
      if (!sessiz) api.serit(v ? "Yaklaş'a dokun. Dünya ile Ay'a bak." : SERIT.boyut);
    }
    function ozet(basi) {
      var a = ayAci(h), key = evreKey(a);
      return (basi ? basi + ' ' : '') + 'A ve B şehrinde Ay aynı: ' + evreAd(key) + '.';
    }

    // ----- zaman -----
    function animDur() { if (zaman) { w.clearTimeout(zaman); zaman = null; } hg = h; }
    function git(yeni, anlik) {
      var onceki = h;
      animDur(); h = yeni; veriYaz();
      if (anlik || yeni === onceki) { hg = h; ciz(); return; }
      var n = 0, N = 12;
      (function kare() {
        if (!kap.isConnected) return;
        n++; hg = onceki + (yeni - onceki) * n / N; ciz();
        if (n < N) zaman = w.setTimeout(kare, 40); else { zaman = null; hg = h; ciz(); }
      })();
    }
    function zamanAdim(dokun) { git(h + HAFTA_B); api.bilgi(ozet('Bir hafta geçti.')); if (dokun) api.dokundu(); }
    var MESAJ = {

    };
    function adim(m) {
      if (sek !== 'hareket') sekmeSec('hareket');
      if (m === 'zaman') { zamanAdim(true); return; }
      git(h + HAREKET[m].birim);
      api.bilgi(ozet(MESAJ[m]));
      api.dokundu();
    }

    sekmeSec('hareket'); seviyeAyar(0, true); sekmeSec('hareket'); git(0, true);
    api.serit(SERIT.hareket);

    return {
      goster: function () {
        function a(yaz, yap) { return { yazi: yaz, yap: yap }; }
        return [
          a("Güneş çok çok büyük. Dünya Ay'dan büyük.", function () { git(0, true); sekmeSec('boyut'); seviyeAyar(1, true); }),
          a('Dünya bir tur döndü: Gün 1.', function () { git(0, true); sekmeSec('hareket'); git(GUN_B); api.bilgi(ozet(MESAJ.don)); }),
          a('Ay bir evre döngüsü yaptı: takvimdeki ay 1.', function () { git(0, true); git(AY_B); api.bilgi(ozet(MESAJ.ay)); }),
          a("Dünya Güneş'i dolandı: Yıl 1.", function () { git(0, true); git(YIL_B); api.bilgi(ozet(MESAJ.dolan)); }),
          a('A ve B şehrinde Ay aynı evrede.', function () { git(15, true); api.bilgi(ozet('Herkes aynı evreyi görür.')); })
        ];
      },
      soru: soru,
      sifirla: function () { birak(); basili = false; seviyeAyar(0, true); sekmeSec('hareket'); git(0, true); api.bilgi(''); api.serit(SERIT.hareket); }
    };
  }

  w.KESIF.tahtaEkle({

    ad: 'Gök saati',
    amac: "Zamanı ilerlet; Gün, takvimdeki ay ve Yıl sayaçlarını izle.",
    halkalar: ['TEPE'],
    ilkSerit: SERIT.hareket,
    kur: kur,
    soru: soru,
    test: {
      GUN_B: GUN_B, AY_B: AY_B, YIL_B: YIL_B, HAFTA_B: HAFTA_B, HAREKET: HAREKET, BOYUT: BOYUT, UZAKLIK: UZAKLIK, MODEL_MERKEZ: MODEL_MERKEZ,
      sayac: sayac, ayAci: ayAci, yorAci: yorAci, donAci: donAci, evreKey: evreKey, evreAd: evreAd, yan: yan, ayYolu: ayYolu,
      tamamlanan: tamamlanan, soruUret: soru, MERKEZ_SECENEK: MERKEZ_SECENEK, HAREKET_YAZI: HAREKET_YAZI, EKSTRA: EKSTRA, AD: AD
